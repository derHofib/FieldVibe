# Produktions-Overlay (Abschnitt 15): Caddy als einziger nach außen
# publizierter Dienst (TLS via Let's Encrypt, automatisch erneuert).
# Anwendung zusammen mit der Basis-Datei, NICHT mit docker-compose.override.yml
# (das ist reine Lokalentwicklung -- Hot-Reload, offene DB/MinIO-Ports):
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
services:
  backend:
    environment:
      # Uvicorn liest FORWARDED_ALLOW_IPS selbst und ersetzt die Client-IP nur
      # fuer Verbindungen von diesen Adressen durch den X-Forwarded-For-Wert
      # (Caddy). Ohne das sahen die Login-Limiter nur die Proxy-IP und 20
      # Fehlversuche haetten alle Nutzer gesperrt. Kein "*": das Backend ist
      # hier nicht nach aussen publiziert, erreichbar nur im Compose-Netz
      # (Standard-Subnetze, bei eigenem Netz anpassen). Im .ip.yml-Modus bewusst
      # NICHT setzen -- dort haengt kein Proxy davor, der Header waere faelschbar.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_APP: ${DOMAIN_APP}
      # Desktop-Oberflaeche, zeigt auf denselben frontend-Container wie
      # DOMAIN_APP (siehe Caddyfile). Muss hier stehen, weil der caddy-Container
      # kein env_file hat -- {$VAR} im Caddyfile loest nur auf, was hier
      # durchgereicht wird.
      DOMAIN_OFFICE: ${DOMAIN_OFFICE}
      DOMAIN_API: ${DOMAIN_API}
      DOMAIN_S3: ${DOMAIN_S3}
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend
      - minio

volumes:
  caddy-data:
  caddy-config:
