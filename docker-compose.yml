services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fieldvibe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fieldvibe}
      POSTGRES_DB: ${POSTGRES_DB:-fieldvibe}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fieldvibe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fieldvibe}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-generate-with-openssl-rand}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://fieldvibe:fieldvibe@postgres:5432/fieldvibe}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql+psycopg2://fieldvibe:fieldvibe@postgres:5432/fieldvibe}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE:-http://localhost:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-fieldvibe}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-changeme-generate-with-openssl-rand}
      S3_BUCKET_FOTOS: ${S3_BUCKET_FOTOS:-fieldvibe-fotos}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://fieldvibe:fieldvibe@postgres:5432/fieldvibe}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql+psycopg2://fieldvibe:fieldvibe@postgres:5432/fieldvibe}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE:-http://localhost:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-fieldvibe}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-changeme-generate-with-openssl-rand}
      S3_BUCKET_FOTOS: ${S3_BUCKET_FOTOS:-fieldvibe-fotos}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
