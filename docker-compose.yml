# Log-Rotation fuer alle Dienste: ohne Grenze waechst die json-file-Logdatei
# je Container unbegrenzt und fuellt irgendwann die Platte.
x-logging: &standard-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    # Major 16 fest; Minor-Releases (16.x) sind bei Postgres die Sicherheits-
    # und Fehlerkorrekturen und bleiben bewusst automatisch.
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *standard-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fieldvibe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fieldvibe}
      POSTGRES_DB: ${POSTGRES_DB:-fieldvibe}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fieldvibe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Fest gepinnt statt :latest -- ein ungeplantes Image-Update beim
    # naechsten Build soll den Dateispeicher nicht veraendern. Update nur bewusst.
    # MinIO veroeffentlicht diese Releases nicht mehr auf Docker Hub -- das Tag
    # existiert nur lokal (per `docker tag` vom bisherigen :latest erzeugt).
    # Liegt das Image lokal, wird nie versucht zu pullen.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    pull_policy: missing
    restart: unless-stopped
    logging: *standard-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fieldvibe}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-generate-with-openssl-rand}
      # Statischer Master-Key fuer SSE-S3 -- ohne ihn lehnt MinIO jeden
      # Upload mit ServerSideEncryption=AES256 ab (siehe storage_service.py),
      # das ist kein optionales Feature, siehe .env.example.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    logging: *standard-logging
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://fieldvibe:fieldvibe@postgres:5432/fieldvibe}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql+psycopg2://fieldvibe:fieldvibe@postgres:5432/fieldvibe}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE:-http://localhost:9000}
      # Service-Account mit Bucket-Policy (scripts/minio-service-account.sh);
      # ohne eigenen Eintrag Rueckfall auf den Root-Zugang (lokale Entwicklung,
      # Bestandsinstallation vor dem ersten deploy.sh-Lauf).
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-fieldvibe}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-changeme-generate-with-openssl-rand}}
      S3_BUCKET_FOTOS: ${S3_BUCKET_FOTOS:-fieldvibe-fotos}
      S3_OBJECT_LOCK: ${S3_OBJECT_LOCK:-false}
      S3_RECHNUNGEN_RETENTION: ${S3_RECHNUNGEN_RETENTION:-off}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # /health/ready: DB, Objektspeicher und Migrationsstand (siehe docs/BETRIEB.md).
    # Vor der ersten Migration bleibt der Container deshalb "unhealthy" -- deploy.sh
    # migriert, bevor es Backend/Worker/Frontend startet.
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "backend"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        VITE_IMPRESSUM_URL: ${VITE_IMPRESSUM_URL:-}
        VITE_DATENSCHUTZ_URL: ${VITE_DATENSCHUTZ_URL:-}
    restart: unless-stopped
    logging: *standard-logging
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4173/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *standard-logging
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://fieldvibe:fieldvibe@postgres:5432/fieldvibe}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql+psycopg2://fieldvibe:fieldvibe@postgres:5432/fieldvibe}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE:-http://localhost:9000}
      # Service-Account mit Bucket-Policy (scripts/minio-service-account.sh);
      # ohne eigenen Eintrag Rueckfall auf den Root-Zugang (lokale Entwicklung,
      # Bestandsinstallation vor dem ersten deploy.sh-Lauf).
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-fieldvibe}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-changeme-generate-with-openssl-rand}}
      S3_BUCKET_FOTOS: ${S3_BUCKET_FOTOS:-fieldvibe-fotos}
      S3_OBJECT_LOCK: ${S3_OBJECT_LOCK:-false}
      S3_RECHNUNGEN_RETENTION: ${S3_RECHNUNGEN_RETENTION:-off}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Heartbeat-Datei, die der Worker alle paar Sekunden schreibt (app/healthcheck.py).
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "worker"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  postgres-data:
  minio-data:
