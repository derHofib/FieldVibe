name: CI

# Runner-Image bewusst auf ubuntu-24.04 gepinnt statt ubuntu-latest: Ein stilles Hochziehen
# der Basis (Werkzeugversionen wie Postgres-Client, Java) soll nur als eigener, gepruefter
# Commit passieren. Wechsel auf eine neuere Version: alle Jobs gemeinsam umstellen.

on:
  push:
  pull_request:
  workflow_dispatch:

# Neuer Push auf denselben Branch/PR macht den laufenden Lauf obsolet.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Vier Shards (je ein Runner, darin pytest-xdist mit eigener DB je Worker);
  # die Aufteilung macht tests/conftest.py ueber TEST_SHARD_ANZAHL/-INDEX.
  backend-tests-shard:
    name: backend-tests-shard (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldvibe
          POSTGRES_PASSWORD: fieldvibe
          POSTGRES_DB: fieldvibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldvibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.lock

      - name: Backend-Abhaengigkeiten installieren
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      # Das postgres-Image macht POSTGRES_USER (fieldvibe) zum Bootstrap-
      # Superuser, der RLS immer umgeht und sich nicht herabstufen laesst
      # (ALTER ROLE ... NOSUPERUSER scheitert). tests/conftest.py und die App-
      # Startpruefung verlangen eine normale Rolle -- also eine eigene
      # Testrolle anlegen. CREATEDB, weil conftest die Testdatenbank
      # fieldvibe_test selbst anlegt.
      - name: Test-Rolle ohne Superuser/BYPASSRLS anlegen
        env:
          PGPASSWORD: fieldvibe
        run: >-
          psql -h localhost -U fieldvibe -d fieldvibe -v ON_ERROR_STOP=1
          -c "CREATE ROLE fieldvibe_test LOGIN PASSWORD 'fieldvibe_test' NOSUPERUSER NOBYPASSRLS CREATEDB;"

      # System-Rolle fuer system_session() (DATABASE_URL_SYSTEM): BYPASSRLS, aber
      # kein Superuser und ohne Tabellenbesitz. Die Tabellenrechte vergibt
      # tests/conftest.py nach der Migration.
      - name: System-Rolle anlegen
        env:
          PGPASSWORD: fieldvibe
        run: >-
          psql -h localhost -U fieldvibe -d fieldvibe -v ON_ERROR_STOP=1
          -c "CREATE ROLE fieldvibe_test_system LOGIN PASSWORD 'fieldvibe_test_system' NOSUPERUSER BYPASSRLS;"

      # Wegwerf-DB: Durability bringt hier nichts, die Schreib-Syncs (v. a. beim
      # TRUNCATE je Test) kosten aber Laufzeit. Alle drei sind per Reload aenderbar.
      - name: Postgres ohne fsync
        env:
          PGPASSWORD: fieldvibe
        run: >-
          psql -h localhost -U fieldvibe -d fieldvibe -v ON_ERROR_STOP=1
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"

      # Cache nur zur Ausfallsicherheit gegen Maven-Central-Aussetzer: installieren.sh
      # prueft jede Datei auch aus dem Cache gegen die SHA-256 aus pins.sh.
      - name: E-Rechnungs-Werkzeug-Cache
        uses: actions/cache@v4
        with:
          path: .cache/e-rechnung
          key: e-rechnung-${{ hashFiles('scripts/e-rechnung/pins.sh', 'scripts/e-rechnung/installieren.sh') }}

      # Ohne das Werkzeug werden die Konformitaetstests in `pytest` still
      # uebersprungen (Java ist auf ubuntu-latest vorinstalliert).
      - name: E-Rechnungs-Pruefwerkzeug installieren
        run: scripts/e-rechnung/installieren.sh

      # JWT_SECRET/S3_*-Defaults kommen aus tests/conftest.py
      # (os.environ.setdefault) -- moto stellt den S3-Mock selbst, kein MinIO
      # noetig. Nur die DB-URLs zeigen auf die Testrolle statt auf den
      # Bootstrap-Superuser.
      - name: pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://fieldvibe_test:fieldvibe_test@localhost:5432/fieldvibe_test
          DATABASE_URL_SYNC: postgresql+psycopg2://fieldvibe_test:fieldvibe_test@localhost:5432/fieldvibe_test
          DATABASE_URL_SYSTEM: postgresql+asyncpg://fieldvibe_test_system:fieldvibe_test_system@localhost:5432/fieldvibe_test
          TEST_SHARD_ANZAHL: 4
          TEST_SHARD_INDEX: ${{ matrix.shard }}
        run: pytest -n 4 -p no:cacheprovider

  # Stabiler Check-Name fuer needs/Branch-Protection, unabhaengig von der Shard-Anzahl.
  backend-tests:
    runs-on: ubuntu-24.04
    needs: backend-tests-shard
    if: always()
    steps:
      - name: Gesamtergebnis der Shards pruefen
        run: |
          if [ "${{ needs.backend-tests-shard.result }}" != "success" ]; then
            echo "Mindestens ein Shard ist nicht erfolgreich: ${{ needs.backend-tests-shard.result }}"
            exit 1
          fi

  # Prueft die ausgehende E-Rechnung (CII, Profil EN 16931 und XRechnung) gegen die CEN-
  # Geschaeftsregeln und die BR-DE-Regeln (Schematron). Das Werkzeug kommt komplett aus Maven
  # Central und gepinnten Commits von ConnectingEurope/eInvoicing-EN16931 und
  # itplr-kosit/xrechnung-schematron (siehe scripts/e-rechnung/pins.sh, jede Datei mit
  # SHA-256 geprueft) -- keine Release-Downloads noetig. Dieser Job schlaegt
  # bei uebersprungenen Tests fehl; backend-tests-shard installiert das Werkzeug ebenfalls.
  e-rechnung-konformitaet:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldvibe
          POSTGRES_PASSWORD: fieldvibe
          POSTGRES_DB: fieldvibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldvibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.lock

      - name: Backend-Abhaengigkeiten installieren
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: Test-Rolle ohne Superuser/BYPASSRLS anlegen
        env:
          PGPASSWORD: fieldvibe
        run: >-
          psql -h localhost -U fieldvibe -d fieldvibe -v ON_ERROR_STOP=1
          -c "CREATE ROLE fieldvibe_test LOGIN PASSWORD 'fieldvibe_test' NOSUPERUSER NOBYPASSRLS CREATEDB;"

      # System-Rolle fuer system_session() (DATABASE_URL_SYSTEM): BYPASSRLS, aber
      # kein Superuser und ohne Tabellenbesitz. Die Tabellenrechte vergibt
      # tests/conftest.py nach der Migration.
      - name: System-Rolle anlegen
        env:
          PGPASSWORD: fieldvibe
        run: >-
          psql -h localhost -U fieldvibe -d fieldvibe -v ON_ERROR_STOP=1
          -c "CREATE ROLE fieldvibe_test_system LOGIN PASSWORD 'fieldvibe_test_system' NOSUPERUSER BYPASSRLS;"

      # Wegwerf-DB: Durability bringt hier nichts, die Schreib-Syncs (v. a. beim
      # TRUNCATE je Test) kosten aber Laufzeit. Alle drei sind per Reload aenderbar.
      - name: Postgres ohne fsync
        env:
          PGPASSWORD: fieldvibe
        run: >-
          psql -h localhost -U fieldvibe -d fieldvibe -v ON_ERROR_STOP=1
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"

      - name: Java pruefen
        run: java -version

      # Cache nur zur Ausfallsicherheit gegen Maven-Central-Aussetzer: installieren.sh
      # prueft jede Datei auch aus dem Cache gegen die SHA-256 aus pins.sh.
      - name: E-Rechnungs-Werkzeug-Cache
        uses: actions/cache@v4
        with:
          path: .cache/e-rechnung
          key: e-rechnung-${{ hashFiles('scripts/e-rechnung/pins.sh', 'scripts/e-rechnung/installieren.sh') }}

      - name: Pruefwerkzeug installieren
        run: scripts/e-rechnung/installieren.sh

      - name: Konformitaetstests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://fieldvibe_test:fieldvibe_test@localhost:5432/fieldvibe_test
          DATABASE_URL_SYNC: postgresql+psycopg2://fieldvibe_test:fieldvibe_test@localhost:5432/fieldvibe_test
          DATABASE_URL_SYSTEM: postgresql+asyncpg://fieldvibe_test_system:fieldvibe_test_system@localhost:5432/fieldvibe_test
        # -rs zeigt, falls Tests wegen fehlendem Werkzeug uebersprungen wuerden; dann
        # soll der Job rot werden statt faelschlich gruen.
        run: |
          set -euo pipefail
          pytest tests/test_e_rechnung_konformitaet.py -rs | tee /tmp/konformitaet.log
          if grep -q SKIPPED /tmp/konformitaet.log; then echo "Tests wurden uebersprungen" >&2; exit 1; fi

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Verifiziert, was in dieser Sandbox nicht getestet werden kann
      # (kein Docker-Daemon dort) -- beide Stages, damit auch die
      # Test/CI-Stage (deps) nicht kaputt geht.
      - name: Produktions-Image bauen (runtime-Stage)
        run: docker build --target runtime -t socialcrm-backend:ci ./backend

      - name: Test/CI-Image bauen (deps-Stage)
        run: docker build --target deps -t socialcrm-backend-deps:ci ./backend

      - name: Frontend-Image bauen (production-Stage)
        run: docker build --target production -t socialcrm-frontend:ci ./frontend

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend-Abhaengigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run lint

      - name: Tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  # Barrierefreiheit des Kundenportals (axe-core, BFSG/WCAG 2.1 AA): Produktions-
  # Build hinter `vite preview`, API per page.route gemockt -- kein Backend noetig.
  # Serious/critical-Befunde lassen den Job scheitern.
  frontend-a11y:
    runs-on: ubuntu-24.04
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend-Abhaengigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Chromium fuer Playwright installieren
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Preview-Server starten
        working-directory: frontend
        run: |
          npx vite preview --host localhost --port 4173 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && exit 0; sleep 1; done
          echo "Preview-Server nicht erreichbar" >&2; exit 1

      - name: Portal-a11y-Spec
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:4173
          # Leer = Playwrights eigenes Chromium (lokal: /opt/pw-browsers/chromium).
          PW_CHROMIUM_PATH: ""
        run: npx playwright test portal-a11y

      - name: Screenshots und Bericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-a11y
          path: |
            frontend/e2e-screenshots
            frontend/e2e-report
          if-no-files-found: ignore

  bugreport-mcp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: tools/bugreport-mcp/.nvmrc
          cache: "npm"
          cache-dependency-path: tools/bugreport-mcp/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: tools/bugreport-mcp
        run: npm ci

      - name: Build
        working-directory: tools/bugreport-mcp
        run: npm run build

      - name: Tests
        working-directory: tools/bugreport-mcp
        run: npm test

  scripts-tests:
    runs-on: ubuntu-24.04
    # Fuer den Test gegen einen echten Postgres (scripts/tests/test_postgres_echt.sh);
    # ohne erreichbaren Server ueberspringt er sich selbst.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldvibe
          POSTGRES_PASSWORD: fieldvibe
          POSTGRES_DB: fieldvibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldvibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge installieren
        # postgresql-client-16 ausdruecklich: Der Client muss zur Server-Major (postgres:16
        # in docker-compose.yml) passen. Ein neuerer pg_dump schreibt Optionen
        # (z. B. transaction_timeout), die ein aelterer Server nicht kennt -- das hat
        # den Job schon einmal rot gemacht, als ubuntu-latest auf ein neueres Image sprang.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck postgresql-client-16 gnupg

      # Faengt Versionsdrift ab, bevor die Shell-Tests kryptisch scheitern.
      - name: Client-Version gegen Server-Major pruefen
        run: |
          server=$(grep -oP 'image:\s*postgres:\K[0-9]+' docker-compose.yml | head -1)
          client=$(pg_dump --version | grep -oP '\d+' | head -1)
          echo "Server-Major (docker-compose.yml): $server, pg_dump-Major: $client"
          [[ -n "$server" && "$server" == "$client" ]] || { echo "pg_dump passt nicht zur Postgres-Server-Major" >&2; exit 1; }

      - name: shellcheck
        run: |
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck -S warning
          shellcheck -S warning scripts/backup/ziele/befehl-beispiel.sh.example

      - name: Shell-Tests (Backup/Restore/Deploy)
        run: bash scripts/tests/run.sh

  # Echter Test der getrennten Datenbank-Owner-Rolle (Standard, scripts/app_rolle_einrichten.sh):
  # Umstellung einer Bestandsinstallation, Besitz/DML-Rechte/RLS-Isolation, Migration als Owner,
  # Restore, backup-pruefen.sh und Abschalten laufen gegen ein echtes Postgres 16 und das
  # echte alembic (docker ist dabei durch einen Shim ersetzt). Ersetzt den frueheren Hinweis
  # "nicht gegen eine echte Datenbank getestet". In scripts-tests (ohne Python-Abhaengigkeiten)
  # ueberspringt sich der Test selbst; hier ist ein SKIP per FV_ECHT_PFLICHT=1 ein Fehler.
  db-owner-umstellung:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldvibe
          POSTGRES_PASSWORD: fieldvibe
          POSTGRES_DB: fieldvibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldvibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.lock

      - name: Backend-Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r backend/requirements-dev.lock

      # Client-Major muss zum Server (postgres:16) passen, siehe scripts-tests.
      - name: Werkzeuge installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16 gnupg

      # python/alembic liegen durch setup-python im PATH, FV_PYTHON_BIN bleibt leer.
      - name: Owner-Umstellung gegen echtes Postgres testen
        env:
          FV_ECHT_PFLICHT: "1"
        run: bash scripts/tests/run.sh test_db_owner_echt.sh

  # Abhaengigkeits-Audits: bewusst NICHT blockierend (continue-on-error), damit ein neu
  # veroeffentlichter CVE keine unbeteiligte Aenderung rot macht. Befunde stehen im Job-Log
  # und in der Zusammenfassung; Umgang mit Ausnahmen: docs/BETRIEB.md, "Abhaengigkeiten".
  # Dependabot (.github/dependabot.yml) schlaegt die Updates woechentlich vor.
  pip-audit:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit installieren
        run: python -m pip install pip-audit==2.10.1

      # --no-deps/--disable-pip: geprueft werden genau die gepinnten Versionen aus dem Lockfile.
      # Bewusst akzeptierte Befunde als --ignore-vuln <ID> ergaenzen und in docs/BETRIEB.md
      # begruenden.
      - name: Produktions-Abhaengigkeiten pruefen
        run: |
          set -o pipefail
          pip-audit -r backend/requirements.lock --no-deps --disable-pip | tee /tmp/pip-audit.txt

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo '### pip-audit (backend/requirements.lock)'
            echo '```'
            cat /tmp/pip-audit.txt 2>/dev/null || echo 'kein Ergebnis'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  npm-audit:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      # Nur Produktions-Abhaengigkeiten, ab "high".
      - name: Frontend pruefen
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # Baut und veroeffentlicht die Container-Images in der GitHub Container Registry (GHCR).
  # Nur nach einem Push auf main oder einem Tag v*, und nur, wenn die Tests gruen sind.
  # Tags: Commit (7 Zeichen, entspricht dem IMAGE_TAG von scripts/deploy.sh), bei v*-Tags
  # zusaetzlich die Version (1.2.3 und 1.2), auf main zusaetzlich "latest".
  # Das Frontend-Image enthaelt die Standard-Build-Argumente (API-URL http://localhost:8000):
  # es dient als Release-Artefakt/Archiv, produktiv baut deploy.sh das Frontend mit den
  # Domains des Servers selbst (VITE_* werden zur Build-Zeit eingebacken).
  images:
    runs-on: ubuntu-24.04
    needs: [backend-tests, frontend, docker-build, scripts-tests, db-owner-umstellung]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR verlangt kleingeschriebene Namen.
      - name: Image-Namen bestimmen
        run: |
          echo "IMAGE_BASIS=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "KURZ_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags Backend
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASIS }}-backend
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Backend-Image (runtime) bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ env.KURZ_SHA }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Tags Frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASIS }}-frontend
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Frontend-Image (production) bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ env.KURZ_SHA }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
