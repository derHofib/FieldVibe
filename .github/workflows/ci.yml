name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldvibe
          POSTGRES_PASSWORD: fieldvibe
          POSTGRES_DB: fieldvibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldvibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend-Abhaengigkeiten installieren
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # DATABASE_URL/JWT_SECRET/S3_*-Defaults kommen aus tests/conftest.py
      # (os.environ.setdefault) und passen exakt zu den Postgres-Service-
      # Zugangsdaten oben -- moto stellt den S3-Mock selbst, kein MinIO
      # noetig.
      - name: pytest
        working-directory: backend
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Verifiziert, was in dieser Sandbox nicht getestet werden kann
      # (kein Docker-Daemon dort) -- beide Stages, damit auch die
      # Test/CI-Stage (deps) nicht kaputt geht.
      - name: Produktions-Image bauen (runtime-Stage)
        run: docker build --target runtime -t socialcrm-backend:ci ./backend

      - name: Test/CI-Image bauen (deps-Stage)
        run: docker build --target deps -t socialcrm-backend-deps:ci ./backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend-Abhaengigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
