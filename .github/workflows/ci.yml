name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Neuer Push auf denselben Branch/PR macht den laufenden Lauf obsolet.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldvibe
          POSTGRES_PASSWORD: fieldvibe
          POSTGRES_DB: fieldvibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldvibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.lock

      - name: Backend-Abhaengigkeiten installieren
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      # Das eingecheckte API-Schema (Grundlage fuer die spaetere Typ-Erzeugung im
      # Frontend, siehe docs/BACKLOG.md) muss zum Code passen. Der App-Import
      # braucht weder Datenbank noch Netz.
      - name: OpenAPI-Schema aktuell?
        run: PYTHON=python ./scripts/openapi-exportieren.sh --pruefen

      # Das postgres-Image macht POSTGRES_USER (fieldvibe) zum Bootstrap-
      # Superuser, der RLS immer umgeht und sich nicht herabstufen laesst
      # (ALTER ROLE ... NOSUPERUSER scheitert). tests/conftest.py und die App-
      # Startpruefung verlangen eine normale Rolle -- also eine eigene
      # Testrolle anlegen. CREATEDB, weil conftest die Testdatenbank
      # fieldvibe_test selbst anlegt.
      - name: Test-Rolle ohne Superuser/BYPASSRLS anlegen
        env:
          PGPASSWORD: fieldvibe
        run: >-
          psql -h localhost -U fieldvibe -d fieldvibe -v ON_ERROR_STOP=1
          -c "CREATE ROLE fieldvibe_test LOGIN PASSWORD 'fieldvibe_test' NOSUPERUSER NOBYPASSRLS CREATEDB;"

      # JWT_SECRET/S3_*-Defaults kommen aus tests/conftest.py
      # (os.environ.setdefault) -- moto stellt den S3-Mock selbst, kein MinIO
      # noetig. Nur die DB-URLs zeigen auf die Testrolle statt auf den
      # Bootstrap-Superuser.
      - name: pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://fieldvibe_test:fieldvibe_test@localhost:5432/fieldvibe_test
          DATABASE_URL_SYNC: postgresql+psycopg2://fieldvibe_test:fieldvibe_test@localhost:5432/fieldvibe_test
        run: pytest

  # Prueft die ausgehende E-Rechnung (CII, Profil EN 16931 und XRechnung) gegen die CEN-
  # Geschaeftsregeln und die BR-DE-Regeln (Schematron). Das Werkzeug kommt komplett aus Maven
  # Central und gepinnten Commits von ConnectingEurope/eInvoicing-EN16931 und
  # itplr-kosit/xrechnung-schematron (siehe scripts/e-rechnung/pins.sh, jede Datei mit
  # SHA-256 geprueft) -- keine Release-Downloads noetig. Im Job backend-tests werden
  # diese Tests mangels Werkzeug uebersprungen.
  e-rechnung-konformitaet:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldvibe
          POSTGRES_PASSWORD: fieldvibe
          POSTGRES_DB: fieldvibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldvibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.lock

      - name: Backend-Abhaengigkeiten installieren
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: Test-Rolle ohne Superuser/BYPASSRLS anlegen
        env:
          PGPASSWORD: fieldvibe
        run: >-
          psql -h localhost -U fieldvibe -d fieldvibe -v ON_ERROR_STOP=1
          -c "CREATE ROLE fieldvibe_test LOGIN PASSWORD 'fieldvibe_test' NOSUPERUSER NOBYPASSRLS CREATEDB;"

      - name: Java pruefen
        run: java -version

      - name: Pruefwerkzeug installieren
        run: scripts/e-rechnung/installieren.sh

      - name: Konformitaetstests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://fieldvibe_test:fieldvibe_test@localhost:5432/fieldvibe_test
          DATABASE_URL_SYNC: postgresql+psycopg2://fieldvibe_test:fieldvibe_test@localhost:5432/fieldvibe_test
        # -rs zeigt, falls Tests wegen fehlendem Werkzeug uebersprungen wuerden; dann
        # soll der Job rot werden statt faelschlich gruen.
        run: |
          set -euo pipefail
          pytest tests/test_e_rechnung_konformitaet.py -rs | tee /tmp/konformitaet.log
          if grep -q SKIPPED /tmp/konformitaet.log; then echo "Tests wurden uebersprungen" >&2; exit 1; fi

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Verifiziert, was in dieser Sandbox nicht getestet werden kann
      # (kein Docker-Daemon dort) -- beide Stages, damit auch die
      # Test/CI-Stage (deps) nicht kaputt geht.
      - name: Produktions-Image bauen (runtime-Stage)
        run: docker build --target runtime -t socialcrm-backend:ci ./backend

      - name: Test/CI-Image bauen (deps-Stage)
        run: docker build --target deps -t socialcrm-backend-deps:ci ./backend

      - name: Frontend-Image bauen (production-Stage)
        run: docker build --target production -t socialcrm-frontend:ci ./frontend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend-Abhaengigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run lint

      - name: Tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  # Barrierefreiheit des Kundenportals (axe-core, BFSG/WCAG 2.1 AA): Produktions-
  # Build hinter `vite preview`, API per page.route gemockt -- kein Backend noetig.
  # Serious/critical-Befunde lassen den Job scheitern.
  frontend-a11y:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend-Abhaengigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Chromium fuer Playwright installieren
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Preview-Server starten
        working-directory: frontend
        run: |
          npx vite preview --host localhost --port 4173 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && exit 0; sleep 1; done
          echo "Preview-Server nicht erreichbar" >&2; exit 1

      - name: Portal-a11y-Spec
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:4173
          # Leer = Playwrights eigenes Chromium (lokal: /opt/pw-browsers/chromium).
          PW_CHROMIUM_PATH: ""
        run: npx playwright test portal-a11y

      - name: Screenshots und Bericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-a11y
          path: |
            frontend/e2e-screenshots
            frontend/e2e-report
          if-no-files-found: ignore

  bugreport-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: tools/bugreport-mcp/.nvmrc
          cache: "npm"
          cache-dependency-path: tools/bugreport-mcp/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: tools/bugreport-mcp
        run: npm ci

      - name: Build
        working-directory: tools/bugreport-mcp
        run: npm run build

      - name: Tests
        working-directory: tools/bugreport-mcp
        run: npm test

  scripts-tests:
    runs-on: ubuntu-latest
    # Fuer den Test gegen einen echten Postgres (scripts/tests/test_postgres_echt.sh);
    # ohne erreichbaren Server ueberspringt er sich selbst.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldvibe
          POSTGRES_PASSWORD: fieldvibe
          POSTGRES_DB: fieldvibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldvibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck postgresql-client gnupg

      - name: shellcheck
        run: |
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck -S warning
          shellcheck -S warning scripts/backup/ziele/befehl-beispiel.sh.example

      - name: Shell-Tests (Backup/Restore/Deploy)
        run: bash scripts/tests/run.sh

  # Abhaengigkeits-Audits: bewusst NICHT blockierend (continue-on-error), damit ein neu
  # veroeffentlichter CVE keine unbeteiligte Aenderung rot macht. Befunde stehen im Job-Log
  # und in der Zusammenfassung; Umgang mit Ausnahmen: docs/BETRIEB.md, "Abhaengigkeiten".
  # Dependabot (.github/dependabot.yml) schlaegt die Updates woechentlich vor.
  pip-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit installieren
        run: python -m pip install pip-audit==2.10.1

      # --no-deps/--disable-pip: geprueft werden genau die gepinnten Versionen aus dem Lockfile.
      # Bewusst akzeptierte Befunde als --ignore-vuln <ID> ergaenzen und in docs/BETRIEB.md
      # begruenden.
      - name: Produktions-Abhaengigkeiten pruefen
        run: |
          set -o pipefail
          pip-audit -r backend/requirements.lock --no-deps --disable-pip | tee /tmp/pip-audit.txt

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo '### pip-audit (backend/requirements.lock)'
            echo '```'
            cat /tmp/pip-audit.txt 2>/dev/null || echo 'kein Ergebnis'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  npm-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      # Nur Produktions-Abhaengigkeiten, ab "high".
      - name: Frontend pruefen
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # Baut und veroeffentlicht die Container-Images in der GitHub Container Registry (GHCR).
  # Nur nach einem Push auf main oder einem Tag v*, und nur, wenn die Tests gruen sind.
  # Tags: Commit (7 Zeichen, entspricht dem IMAGE_TAG von scripts/deploy.sh), bei v*-Tags
  # zusaetzlich die Version (1.2.3 und 1.2), auf main zusaetzlich "latest".
  # Das Frontend-Image enthaelt die Standard-Build-Argumente (API-URL http://localhost:8000):
  # es dient als Release-Artefakt/Archiv, produktiv baut deploy.sh das Frontend mit den
  # Domains des Servers selbst (VITE_* werden zur Build-Zeit eingebacken).
  images:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend, docker-build, scripts-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR verlangt kleingeschriebene Namen.
      - name: Image-Namen bestimmen
        run: |
          echo "IMAGE_BASIS=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "KURZ_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags Backend
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASIS }}-backend
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Backend-Image (runtime) bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ env.KURZ_SHA }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Tags Frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASIS }}-frontend
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Frontend-Image (production) bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ env.KURZ_SHA }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
