name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Neuer Push auf denselben Branch/PR macht den laufenden Lauf obsolet.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldvibe
          POSTGRES_PASSWORD: fieldvibe
          POSTGRES_DB: fieldvibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldvibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.lock

      - name: Backend-Abhaengigkeiten installieren
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      # Das postgres-Image macht POSTGRES_USER (fieldvibe) zum Bootstrap-
      # Superuser, der RLS immer umgeht und sich nicht herabstufen laesst
      # (ALTER ROLE ... NOSUPERUSER scheitert). tests/conftest.py und die App-
      # Startpruefung verlangen eine normale Rolle -- also eine eigene
      # Testrolle anlegen. CREATEDB, weil conftest die Testdatenbank
      # fieldvibe_test selbst anlegt.
      - name: Test-Rolle ohne Superuser/BYPASSRLS anlegen
        env:
          PGPASSWORD: fieldvibe
        run: >-
          psql -h localhost -U fieldvibe -d fieldvibe -v ON_ERROR_STOP=1
          -c "CREATE ROLE fieldvibe_test LOGIN PASSWORD 'fieldvibe_test' NOSUPERUSER NOBYPASSRLS CREATEDB;"

      # JWT_SECRET/S3_*-Defaults kommen aus tests/conftest.py
      # (os.environ.setdefault) -- moto stellt den S3-Mock selbst, kein MinIO
      # noetig. Nur die DB-URLs zeigen auf die Testrolle statt auf den
      # Bootstrap-Superuser.
      - name: pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://fieldvibe_test:fieldvibe_test@localhost:5432/fieldvibe_test
          DATABASE_URL_SYNC: postgresql+psycopg2://fieldvibe_test:fieldvibe_test@localhost:5432/fieldvibe_test
        run: pytest

  # Prueft die ausgehende E-Rechnung (CII, Profil EN 16931 und XRechnung) gegen die CEN-
  # Geschaeftsregeln und die BR-DE-Regeln (Schematron). Das Werkzeug kommt komplett aus Maven
  # Central und gepinnten Commits von ConnectingEurope/eInvoicing-EN16931 und
  # itplr-kosit/xrechnung-schematron (siehe scripts/e-rechnung/pins.sh, jede Datei mit
  # SHA-256 geprueft) -- keine Release-Downloads noetig. Im Job backend-tests werden
  # diese Tests mangels Werkzeug uebersprungen.
  e-rechnung-konformitaet:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldvibe
          POSTGRES_PASSWORD: fieldvibe
          POSTGRES_DB: fieldvibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldvibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.lock

      - name: Backend-Abhaengigkeiten installieren
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: Test-Rolle ohne Superuser/BYPASSRLS anlegen
        env:
          PGPASSWORD: fieldvibe
        run: >-
          psql -h localhost -U fieldvibe -d fieldvibe -v ON_ERROR_STOP=1
          -c "CREATE ROLE fieldvibe_test LOGIN PASSWORD 'fieldvibe_test' NOSUPERUSER NOBYPASSRLS CREATEDB;"

      - name: Java pruefen
        run: java -version

      - name: Pruefwerkzeug installieren
        run: scripts/e-rechnung/installieren.sh

      - name: Konformitaetstests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://fieldvibe_test:fieldvibe_test@localhost:5432/fieldvibe_test
          DATABASE_URL_SYNC: postgresql+psycopg2://fieldvibe_test:fieldvibe_test@localhost:5432/fieldvibe_test
        # -rs zeigt, falls Tests wegen fehlendem Werkzeug uebersprungen wuerden; dann
        # soll der Job rot werden statt faelschlich gruen.
        run: |
          set -euo pipefail
          pytest tests/test_e_rechnung_konformitaet.py -rs | tee /tmp/konformitaet.log
          if grep -q SKIPPED /tmp/konformitaet.log; then echo "Tests wurden uebersprungen" >&2; exit 1; fi

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Verifiziert, was in dieser Sandbox nicht getestet werden kann
      # (kein Docker-Daemon dort) -- beide Stages, damit auch die
      # Test/CI-Stage (deps) nicht kaputt geht.
      - name: Produktions-Image bauen (runtime-Stage)
        run: docker build --target runtime -t socialcrm-backend:ci ./backend

      - name: Test/CI-Image bauen (deps-Stage)
        run: docker build --target deps -t socialcrm-backend-deps:ci ./backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend-Abhaengigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run lint

      - name: Tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  # Barrierefreiheit des Kundenportals (axe-core, BFSG/WCAG 2.1 AA): Produktions-
  # Build hinter `vite preview`, API per page.route gemockt -- kein Backend noetig.
  # Serious/critical-Befunde lassen den Job scheitern.
  frontend-a11y:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend-Abhaengigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Chromium fuer Playwright installieren
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Preview-Server starten
        working-directory: frontend
        run: |
          npx vite preview --host localhost --port 4173 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && exit 0; sleep 1; done
          echo "Preview-Server nicht erreichbar" >&2; exit 1

      - name: Portal-a11y-Spec
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:4173
          # Leer = Playwrights eigenes Chromium (lokal: /opt/pw-browsers/chromium).
          PW_CHROMIUM_PATH: ""
        run: npx playwright test portal-a11y

      - name: Screenshots und Bericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-a11y
          path: |
            frontend/e2e-screenshots
            frontend/e2e-report
          if-no-files-found: ignore

  bugreport-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: tools/bugreport-mcp/.nvmrc
          cache: "npm"
          cache-dependency-path: tools/bugreport-mcp/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: tools/bugreport-mcp
        run: npm ci

      - name: Build
        working-directory: tools/bugreport-mcp
        run: npm run build

      - name: Tests
        working-directory: tools/bugreport-mcp
        run: npm test

  scripts-tests:
    runs-on: ubuntu-latest
    # Fuer den Test gegen einen echten Postgres (scripts/tests/test_postgres_echt.sh);
    # ohne erreichbaren Server ueberspringt er sich selbst.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldvibe
          POSTGRES_PASSWORD: fieldvibe
          POSTGRES_DB: fieldvibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldvibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck postgresql-client gnupg

      - name: shellcheck
        run: |
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck -S warning
          shellcheck -S warning scripts/backup/ziele/befehl-beispiel.sh.example

      - name: Shell-Tests (Backup/Restore)
        run: bash scripts/tests/run.sh
