name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldvibe
          POSTGRES_PASSWORD: fieldvibe
          POSTGRES_DB: fieldvibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldvibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend-Abhaengigkeiten installieren
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Das postgres-Image macht POSTGRES_USER (fieldvibe) zum Bootstrap-
      # Superuser, der RLS immer umgeht und sich nicht herabstufen laesst
      # (ALTER ROLE ... NOSUPERUSER scheitert). tests/conftest.py und die App-
      # Startpruefung verlangen eine normale Rolle -- also eine eigene
      # Testrolle anlegen. CREATEDB, weil conftest die Testdatenbank
      # fieldvibe_test selbst anlegt.
      - name: Test-Rolle ohne Superuser/BYPASSRLS anlegen
        env:
          PGPASSWORD: fieldvibe
        run: >-
          psql -h localhost -U fieldvibe -d fieldvibe -v ON_ERROR_STOP=1
          -c "CREATE ROLE fieldvibe_test LOGIN PASSWORD 'fieldvibe_test' NOSUPERUSER NOBYPASSRLS CREATEDB;"

      # JWT_SECRET/S3_*-Defaults kommen aus tests/conftest.py
      # (os.environ.setdefault) -- moto stellt den S3-Mock selbst, kein MinIO
      # noetig. Nur die DB-URLs zeigen auf die Testrolle statt auf den
      # Bootstrap-Superuser.
      - name: pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://fieldvibe_test:fieldvibe_test@localhost:5432/fieldvibe_test
          DATABASE_URL_SYNC: postgresql+psycopg2://fieldvibe_test:fieldvibe_test@localhost:5432/fieldvibe_test
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Verifiziert, was in dieser Sandbox nicht getestet werden kann
      # (kein Docker-Daemon dort) -- beide Stages, damit auch die
      # Test/CI-Stage (deps) nicht kaputt geht.
      - name: Produktions-Image bauen (runtime-Stage)
        run: docker build --target runtime -t socialcrm-backend:ci ./backend

      - name: Test/CI-Image bauen (deps-Stage)
        run: docker build --target deps -t socialcrm-backend-deps:ci ./backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend-Abhaengigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
