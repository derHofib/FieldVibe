<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>FieldVibe</title>
    <script>
      // Verhindert Aufblitzen (Abschnitt 2.1): setzt die .dark-Klasse vor dem
      // ersten Paint, noch bevor React/ThemeContext geladen ist. Muss exakt
      // dieselbe Logik wie ThemeContext.tsx:ermittleAngewandtesTheme()
      // spiegeln (dort dokumentiert, warum "automatisch" == kein
      // gespeicherter Wert).
      (function () {
        try {
          var gespeichert = localStorage.getItem('ui.appearance');
          var dunkel =
            gespeichert === 'dark' ||
            (gespeichert !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dunkel) document.documentElement.classList.add('dark');
        } catch (e) {
          // Privater Modus o. Ae. -- dann eben ohne Vorab-Anwendung, React
          // uebernimmt gleich danach.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
